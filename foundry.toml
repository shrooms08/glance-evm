[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }

[lint]
# Time windows (agent expiry, oracle freshness, rolling 24h cap) are the point of this code, and the few seconds of
# sequencer timestamp drift are irrelevant at hour-scale thresholds.
exclude_lints = ["block-timestamp"]

[fmt]
line_length = 120
