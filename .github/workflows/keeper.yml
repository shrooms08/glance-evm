# Feed keeper: every 5 minutes, mirror the live Chainlink feeds on Robinhood Chain MAINNET (price AND their own
# updatedAt) onto Glance's TestPriceFeed stand-ins on Robinhood Chain TESTNET. Copying updatedAt, never "now", is what
# makes the stand-ins fresh during market hours and frozen at weekends, exactly like the real feeds.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   KEEPER_PRIVATE_KEY          owner of the testnet feeds. A DISPOSABLE TESTNET KEY: never put a key that holds real
#                               value here. It can set testnet prices; it can never move real funds.
#   ROBINHOOD_TESTNET_RPC_URL   e.g. https://rpc.testnet.chain.robinhood.com
#   ROBINHOOD_MAINNET_RPC_URL   e.g. https://rpc.mainnet.chain.robinhood.com (read only)
#
# Pause: commit and push a file named keeper.paused at the repo root (make keeper-pause creates it locally). While it
# exists this workflow does nothing, so a feed frozen on purpose for the weekend demo is not overwritten.
# GitHub may delay or skip scheduled runs under load; five minutes is the shortest schedule it offers.
name: Feed keeper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed-keeper
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check the pause switch
        id: pause
        run: |
          if [ -f keeper.paused ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "keeper.paused exists in the repo: skipping this run."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.pause.outputs.paused == 'false'

      - uses: actions/setup-node@v4
        if: steps.pause.outputs.paused == 'false'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.pause.outputs.paused == 'false'
        run: pnpm install --frozen-lockfile --filter keeper

      - name: Mirror feeds once
        if: steps.pause.outputs.paused == 'false'
        run: pnpm --filter keeper once
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_URL }}
          MAINNET_RPC_URL: ${{ secrets.ROBINHOOD_MAINNET_RPC_URL }}
